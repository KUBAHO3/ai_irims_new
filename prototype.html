<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rwanda FDA regulatory services portal (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --paper: #F3F6F4;
  --surface: #FFFFFF;
  --surface-2: #E9EFEB;
  --ink: #17231C;
  --ink-2: #4B5C52;
  --ink-3: #6E7D74;
  --line: #D3DDD6;
  --line-strong: #B7C6BC;
  --green: #14583A;
  --green-hover: #0F4630;
  --on-green: #FFFFFF;
  --green-soft: #DCEBE2;
  --gold: #855F06;
  --gold-bg: #FBF0D4;
  --gold-line: #DDBC62;
  --sky: #1B6698;
  --sky-bg: #E1EDF6;
  --red: #B42318;
  --red-bg: #FBE3E0;
  --shadow: 0 1px 2px rgba(23,35,28,.06), 0 8px 24px rgba(23,35,28,.08);
  --radius-s: 6px;
  --radius-m: 10px;
  --font: "Public Sans", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0E1611; --surface: #152019; --surface-2: #1C2A21; --ink: #E5EDE7; --ink-2: #A9B8AE; --ink-3: #8A9A90;
    --line: #2B3A30; --line-strong: #3B4D41; --green: #49A877; --green-hover: #5DBA89; --on-green: #08130D; --green-soft: #19352A;
    --gold: #E7B748; --gold-bg: #2D2510; --gold-line: #6E5823; --sky: #74B6E6; --sky-bg: #13283A; --red: #F2776C; --red-bg: #391A17;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0E1611; --surface: #152019; --surface-2: #1C2A21; --ink: #E5EDE7; --ink-2: #A9B8AE; --ink-3: #8A9A90;
  --line: #2B3A30; --line-strong: #3B4D41; --green: #49A877; --green-hover: #5DBA89; --on-green: #08130D; --green-soft: #19352A;
  --gold: #E7B748; --gold-bg: #2D2510; --gold-line: #6E5823; --sky: #74B6E6; --sky-bg: #13283A; --red: #F2776C; --red-bg: #391A17;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
body {
  margin: 0; min-height: 100%; background: var(--paper); color: var(--ink);
  font-family: var(--font); font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--sky); }
img { max-width: 100%; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; letter-spacing: -0.01em; }
h1 { font-size: 30px; font-weight: 800; }
h2 { font-size: 21px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus, var(--sky)); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.stack > * + * { margin-top: 16px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px;
  border-radius: var(--radius-s); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--green); border-color: var(--green); color: var(--on-green); }
.btn.primary:hover { background: var(--green-hover); }
.btn.danger { color: var(--red); border-color: var(--red); background: transparent; }
.btn.danger:hover { background: var(--red-bg); }
.btn.gold { background: var(--gold-bg); border-color: var(--gold-line); color: var(--gold); }
.btn.link { border: 0; background: none; color: var(--sky); padding: 0; min-height: auto; font-weight: 600; }
.btn.small { min-height: 32px; padding: 0 12px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon { width: 18px; height: 18px; flex: none; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .label { font-weight: 600; font-size: 14px; }
.field .hint { font-size: 13px; color: var(--ink-2); }
.req::after { content: " *"; color: var(--red); }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=search], select, textarea {
  width: 100%; min-height: 42px; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-s);
  background: var(--surface); color: var(--ink);
}
textarea { min-height: 90px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--sky); outline-offset: 0; border-color: var(--sky); }
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--red); }
.field .error { color: var(--red); font-size: 13px; display: none; }
.field.invalid .error { display: block; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 20px; }
.span-all { grid-column: 1 / -1; }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--green); flex: none; }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); }
.panel-pad { padding: 20px 22px; }
.panel-head { display: flex; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px solid var(--line); }
.notice { border-radius: var(--radius-m); padding: 14px 16px; border: 1px solid var(--line); background: var(--surface-2); }
.notice.gold { background: var(--gold-bg); border-color: var(--gold-line); }
.notice.sky { background: var(--sky-bg); border-color: transparent; }
.notice.red { background: var(--red-bg); border-color: transparent; }

/* Status badges */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge.draft { background: var(--surface-2); color: var(--ink-2); }
.badge.you { background: var(--gold-bg); color: var(--gold); }
.badge.fda { background: var(--sky-bg); color: var(--sky); }
.badge.ok { background: var(--green-soft); color: var(--green); }
.badge.bad { background: var(--red-bg); color: var(--red); }

/* AI integration slot */
.ai-slot { border: 2px dashed var(--line-strong); border-radius: var(--radius-m); padding: 16px 18px; background: transparent; }
.ai-slot .ai-tag { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 700; color: var(--sky); background: var(--sky-bg); padding: 2px 8px; border-radius: 4px; }

/* ===== Public pages ===== */
.public-top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.public-top .inner { max-width: 1160px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
.brand .logo { width: 44px; height: 44px; border-radius: 8px; background: #fff; display: grid; place-items: center; padding: 3px; border: 1px solid var(--line); }
.brand .logo img { width: 100%; height: 100%; object-fit: contain; }
.brand strong { display: block; font-size: 15px; line-height: 1.15; }
.brand span { display: block; font-size: 12.5px; color: var(--ink-2); line-height: 1.2; }
.public-main { max-width: 1160px; margin: 0 auto; padding: 36px 24px 64px; }
.hero { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 40px; align-items: start; }
.hero h1 { font-size: clamp(30px, 4.2vw, 46px); line-height: 1.08; letter-spacing: -0.025em; max-width: 16ch; }
.hero .lede { font-size: 17px; color: var(--ink-2); max-width: 52ch; margin-top: 14px; }
.track-box { margin-top: 28px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); }
.track-box form { display: flex; gap: 10px; }
.track-result { margin-top: 16px; }
.services { margin-top: 48px; }
.service-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 18px 4px; border-top: 1px solid var(--line); }
.service-row:last-child { border-bottom: 1px solid var(--line); }
.service-row .sicon { width: 44px; height: 44px; border-radius: 10px; background: var(--green-soft); color: var(--green); display: grid; place-items: center; }
.service-row h3 { font-size: 16px; }
.service-row p { color: var(--ink-2); font-size: 14px; }
.auth-card { padding: 24px; }
.auth-card h2 { margin-bottom: 4px; }
.demo-box { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }

/* ===== App shell ===== */
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--surface); border-right: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; overflow-y: auto; }
.side .brand { padding: 16px 18px; border-bottom: 1px solid var(--line); }
.nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-s); text-decoration: none; color: var(--ink); font-weight: 500; }
.nav a:hover { background: var(--surface-2); }
.nav a[aria-current="page"] { background: var(--green-soft); color: var(--green); font-weight: 700; }
.nav a .count { margin-left: auto; font-size: 12px; font-weight: 700; background: var(--gold-bg); color: var(--gold); padding: 0 8px; border-radius: 999px; }
.nav-group { padding: 14px 12px 4px; font-size: 13px; color: var(--ink-3); font-weight: 600; }
.side-foot { margin-top: auto; padding: 14px 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 10px 24px; min-height: 60px; }
.topbar .menu-btn { display: none; }
.role-switch { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px; background: var(--paper); }
.role-switch button { border: 0; background: none; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.role-switch button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.whoami { text-align: right; font-size: 13px; line-height: 1.25; }
.whoami strong { display: block; font-size: 14px; }
.main { padding: 28px 32px 64px; max-width: 1240px; width: 100%; }
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.page-head .sub { color: var(--ink-2); margin-top: 6px; }
.crumbs { font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
.crumbs a { color: var(--ink-2); }

/* ===== Journey rail (signature element) ===== */
.rail { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.rail li { position: relative; padding-top: 22px; font-size: 13px; color: var(--ink-3); font-weight: 500; }
.rail li::before { content: ""; position: absolute; top: 7px; left: 0; right: 0; height: 4px; background: var(--line); }
.rail li:first-child::before { left: 7px; }
.rail li::after { content: ""; position: absolute; top: 2px; left: 0; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--line-strong); }
.rail li.done { color: var(--ink-2); }
.rail li.done::before { background: var(--green); }
.rail li.done::after { background: var(--green); border-color: var(--green); }
.rail li.now { color: var(--ink); font-weight: 700; }
.rail li.now::before { background: linear-gradient(90deg, var(--green) 0 7px, var(--line) 7px); }
.rail li.now.you::after { border-color: var(--gold); background: var(--gold-bg); width: 18px; height: 18px; top: 0; left: -2px; }
.rail li.now.fda::after { border-color: var(--sky); background: var(--sky-bg); width: 18px; height: 18px; top: 0; left: -2px; }
.rail li.now.ok::after { border-color: var(--green); background: var(--green); }
.rail li.now.bad::after { border-color: var(--red); background: var(--red); }
.rail li span { display: block; padding-right: 6px; overflow-wrap: anywhere; }
.rail-caption { display: none; margin: 0 0 10px; font-weight: 700; font-size: 14px; }
.rail-mini { display: inline-flex; gap: 3px; align-items: center; vertical-align: middle; }
.rail-mini i { width: 14px; height: 5px; border-radius: 3px; background: var(--line); }
.rail-mini i.done { background: var(--green); }
.rail-mini i.now.you { background: var(--gold); }
.rail-mini i.now.fda { background: var(--sky); }
.rail-mini i.now.bad { background: var(--red); }
.next-step { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; margin-top: 22px; padding: 16px 18px; border-radius: var(--radius-m); }
.next-step.you { background: var(--gold-bg); border: 1px solid var(--gold-line); }
.next-step.fda { background: var(--sky-bg); }
.next-step.ok { background: var(--green-soft); }
.next-step.bad { background: var(--red-bg); }
.next-step .who { font-weight: 800; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--surface); }
.next-step.you .who { color: var(--gold); }
.next-step.fda .who { color: var(--sky); }
.next-step.ok .who { color: var(--green); }
.next-step.bad .who { color: var(--red); }
.next-step strong { display: block; }

/* Action list */
.action-list { list-style: none; margin: 0; padding: 0; }
.action-list li { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px 22px; border-top: 1px solid var(--line); }
.action-list li:first-child { border-top: 0; }
.action-list .bar { align-self: stretch; border-radius: 3px; background: var(--gold); }
.action-list .bar.red { background: var(--red); }
.action-list .bar.grey { background: var(--line-strong); }
.action-list .title { font-weight: 700; }
.action-list .meta { font-size: 13px; color: var(--ink-2); }

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: 13px; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover td { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
.ref { font-weight: 700; white-space: nowrap; }
.empty { padding: 36px 22px; text-align: center; color: var(--ink-2); }

/* Filter chips */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.chip b { font-weight: 800; }
a.chip { text-decoration: none; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 14px 22px; border-bottom: 1px solid var(--line); }
.toolbar input[type=search] { max-width: 280px; }
.toolbar select { width: auto; min-width: 180px; }

/* Wizard */
.wizard { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 28px; align-items: start; }
.steps { list-style: none; margin: 0; padding: 0; position: sticky; top: 84px; }
.steps li button { width: 100%; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; padding: 10px 8px; border: 0; background: none; border-radius: var(--radius-s); cursor: pointer; }
.steps li button:hover { background: var(--surface-2); }
.steps .num { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--ink-2); background: var(--surface); }
.steps li.done .num { background: var(--green); border-color: var(--green); color: var(--on-green); }
.steps li.current button { background: var(--surface); box-shadow: inset 3px 0 0 var(--green); }
.steps li.current .num { border-color: var(--green); color: var(--green); }
.steps .t { font-weight: 600; font-size: 14px; }
.steps .s { font-size: 12.5px; color: var(--ink-2); }
.wizard-foot { display: flex; gap: 12px; align-items: center; padding: 16px 22px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.saved { font-size: 13px; color: var(--ink-2); }

/* Choice cards for starting an application */
.choice-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.choice { position: relative; border: 1.5px solid var(--line-strong); border-radius: var(--radius-m); padding: 14px 16px; cursor: pointer; background: var(--surface); }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice strong { display: block; }
.choice span { font-size: 13px; color: var(--ink-2); }
.choice:has(input:checked) { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); background: var(--green-soft); }
.choice:has(input:focus-visible) { outline: 3px solid var(--sky); outline-offset: 2px; }
.start-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.need-list { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.need-list li { padding: 8px 0 8px 22px; border-top: 1px solid var(--line); position: relative; }
.need-list li::before { content: ""; position: absolute; left: 2px; top: 15px; width: 9px; height: 9px; border-radius: 2px; border: 2px solid var(--green); }
.need-list li.opt::before { border-color: var(--line-strong); }

/* Documents */
.doc-list { list-style: none; margin: 0; padding: 0; }
.doc-list li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 22px; border-top: 1px solid var(--line); }
.doc-list li:first-child { border-top: 0; }
.doc-state { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line-strong); }
.doc-state.ok { background: var(--green); border-color: var(--green); color: var(--on-green); }
.doc-state.missing { border-color: var(--red); }
.doc-name { font-weight: 600; font-size: 14px; }
.doc-file { font-size: 13px; color: var(--ink-2); }
.progress { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--green); transition: width .3s ease; }

/* Detail tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); padding: 0 14px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 14px 12px 12px; font-weight: 600; color: var(--ink-2); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--green); }
.tabs .dot { display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 999px; font-size: 12px; background: var(--gold-bg); color: var(--gold); margin-left: 6px; }
dl.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px 24px; margin: 0; }
dl.facts dt { font-size: 13px; color: var(--ink-2); }
dl.facts dd { margin: 2px 0 0; font-weight: 600; overflow-wrap: anywhere; }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { position: relative; padding: 0 0 20px 26px; }
.timeline li::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: -4px; width: 2px; background: var(--line); }
.timeline li:last-child::before { display: none; }
.timeline li::after { content: ""; position: absolute; left: 0; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--green); }
.timeline li.fda::after { border-color: var(--sky); }
.timeline .when { font-size: 13px; color: var(--ink-2); }
.thread { display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 640px; padding: 12px 16px; border-radius: var(--radius-m); background: var(--surface-2); }
.msg.fda { background: var(--sky-bg); }
.msg.you { margin-left: auto; background: var(--green-soft); }
.msg .from { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.msg .when { font-size: 12px; color: var(--ink-2); margin-top: 6px; }

/* Assessor workspace */
.case-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px 20px; padding: 16px 22px; }
.case-bar dt { font-size: 12.5px; color: var(--ink-2); }
.case-bar dd { margin: 0; font-weight: 700; }
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; margin-top: 20px; }
.decision { position: sticky; top: 84px; }
.stage-summary td:last-child, .stage-summary th:last-child { text-align: right; }
.due { font-size: 13px; font-weight: 600; white-space: nowrap; }
.due.over { color: var(--red); }
.due.soon { color: var(--gold); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 14px 16px; }
.kpi b { display: block; font-size: 26px; font-weight: 800; line-height: 1.1; }
.kpi span { font-size: 13px; color: var(--ink-2); }
.kpi.alert b { color: var(--red); }
.kpi.warn b { color: var(--gold); }

/* Modal + toast */
.modal-back { position: fixed; inset: 0; background: rgba(10, 18, 13, .5); display: grid; place-items: center; padding: 20px; z-index: 50; }
.modal { background: var(--surface); color: var(--ink); border-radius: 12px; box-shadow: var(--shadow); width: min(640px, 100%); max-height: calc(100vh - 40px); overflow: auto; }
.modal header { display: flex; align-items: center; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
.modal .body { padding: 20px 22px; }
.modal footer { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 22px; border-top: 1px solid var(--line); }
.toast-wrap { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; z-index: 60; }
.toast { background: var(--ink); color: var(--paper); padding: 12px 16px; border-radius: var(--radius-s); box-shadow: var(--shadow); max-width: 380px; font-weight: 500; }
.certificate { border: 6px double var(--green); padding: 28px; text-align: center; background: var(--surface); }
.certificate h2 { margin: 10px 0 6px; }

@media (max-width: 1080px) {
  .workspace { grid-template-columns: minmax(0, 1fr); }
  .decision { position: static; }
  .start-layout { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: 0; bottom: 0; height: 100%; width: 270px; z-index: 40; transform: translateX(-100%); transition: transform .2s ease; padding-top: env(safe-area-inset-top, 0px); }
  .shell.nav-open .side { transform: none; box-shadow: var(--shadow); }
  .topbar .menu-btn { display: inline-flex; }
  .main { padding: 20px 16px 56px; }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .wizard { grid-template-columns: minmax(0, 1fr); }
  .steps { position: static; display: flex; overflow-x: auto; gap: 4px; }
  .steps li { flex: none; }
  .steps .s { display: none; }
  .grid-3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .whoami { display: none; }
}
@media (max-width: 640px) {
  .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); }
  .rail-caption { display: block; }
  .rail li { padding-top: 16px; }
  .rail li span { display: none; }
  .next-step { grid-template-columns: minmax(0, 1fr); }
  .next-step .who { justify-self: start; }
  .topbar { padding: 8px 12px; gap: 8px; }
  .topbar .btn .lbl { display: none; }
  .role-switch button { padding: 5px 9px; }
  .service-row { grid-template-columns: 40px minmax(0, 1fr); }
  .service-row .actions { grid-column: 2; }
  .track-box form { flex-direction: column; }
  .public-main { padding: 24px 16px 48px; }
  .action-list li { grid-template-columns: 6px minmax(0, 1fr); }
  .action-list li .btn { grid-column: 2; justify-self: start; }
  h1 { font-size: 25px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print {
  .side, .topbar, .no-print, .toast-wrap { display: none !important; }
  .shell { display: block; }
  .modal-back { position: static; background: none; padding: 0; }
  .modal { box-shadow: none; max-height: none; }
}
</style>
</head>

function modal({ title, body, actions = [], wide = false }) {
  const back = document.createElement('div'); back.className = 'modal-back';
  back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle" style="${wide ? 'width:min(860px,100%)' : ''}">
    <header><h2 id="mtitle" style="font-size:18px">${title}</h2><span class="spacer"></span><button class="btn small" data-close aria-label="Close">Close</button></header>
    <div class="body">${body}</div>
    ${actions.length ? `<footer>${actions.map((a, i) => `<button class="btn ${a.kind || ''}" data-act="${i}">${a.label}</button>`).join('')}</footer>` : ''}
  </div>`;
  const prev = document.activeElement;
  const close = () => { back.remove(); document.removeEventListener('keydown', onKey); if (prev && prev.focus) prev.focus(); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  back.addEventListener('click', (e) => { if (e.target === back || e.target.closest('[data-close]')) close(); });
  actions.forEach((a, i) => back.querySelector(`[data-act="${i}"]`).addEventListener('click', () => { if (a.onClick(back) !== false) close(); }));
  document.body.appendChild(back);
  const first = back.querySelector('input, select, textarea, footer .btn.primary, [data-close]'); if (first) first.focus();
  return back;
}

/* Ownership and next step: the core of the journey rail */
function journey(app) {
  const inv = app.invoice || {};
  if (app.status === 'draft') return { who: 'you', label: 'With you', title: 'Finish and submit your application', detail: `Step ${(app.step || 0) + 1} of 5. Your progress is saved.` };
  if (app.status === 'awaiting_payment') return { who: 'you', label: 'With you', title: `Pay invoice ${inv.no} (${money(inv.amount)})`, detail: `Then upload the proof of payment. Assessment starts once Rwanda FDA confirms it. Pay by ${fmtDate(new Date(new Date(app.stageAt).getTime() + SLA.payment * DAY).toISOString())}.` };
  if (app.status === 'queried') { const q = lastOpenQuery(app); return { who: 'you', label: 'With you', title: 'Answer the query from Rwanda FDA', detail: `Raised ${fmtDate(q && q.at)} at ${STAGE_NAME[app.stage].toLowerCase()}. Respond within ${Math.max(0, daysLeft(app.queriedAt, SLA.queried))} days to keep your application active.` }; }
  if (app.status === 'approved') return { who: 'ok', label: 'Registered', title: `Certificate ${app.certNo} issued`, detail: `Valid until ${fmtDate(app.expires)}.` };
  if (app.status === 'rejected') return { who: 'bad', label: 'Rejected', title: 'Application rejected', detail: 'The reason is in the history tab. You can submit a new application after addressing it.' };
  const expect = new Date(new Date(app.stageAt).getTime() + SLA[app.stage] * DAY).toISOString();
  const what = { verification: 'Rwanda FDA is confirming your payment', screening: 'Rwanda FDA is checking that your dossier is complete', assessment: 'Assessors are evaluating your product', approval: 'Waiting for the final decision' }[app.stage];
  return { who: 'fda', label: 'With Rwanda FDA', title: what, detail: `Expected to finish this stage by ${fmtDate(expect)}. Nothing is needed from you now.` };
}
function lastOpenQuery(app) { return [...(app.queries || [])].reverse().find((q) => q.from === 'fda' && !q.answered); }
function statusBadge(app) {
  if (app.status === 'draft') return '<span class="badge draft">Draft</span>';
  if (app.status === 'awaiting_payment') return '<span class="badge you">Payment due</span>';
  if (app.status === 'queried') return '<span class="badge you">Query to answer</span>';
  if (app.status === 'approved') return '<span class="badge ok">Registered</span>';
  if (app.status === 'rejected') return '<span class="badge bad">Rejected</span>';
  return `<span class="badge fda">${esc(STAGE_NAME[app.stage])}</span>`;
}
function railHTML(app) {
  const idx = STAGE_INDEX[app.stage];
  const j = journey(app);
  const capLabel = app.status === 'approved' ? 'Registered' : app.status === 'rejected' ? 'Rejected' : RAIL[idx] + (app.status === 'queried' ? ' (query)' : '');
  return `<p class="rail-caption" aria-hidden="true">Stage ${idx + 1} of 7: ${esc(capLabel)}</p><ol class="rail" aria-label="Application progress">${RAIL.map((name, i) => {
    let cls = '', label = name;
    if (i < idx) cls = 'done';
    if (i === idx) cls = `now ${j.who}`;
    if (i === 6 && app.status === 'approved') label = 'Registered';
    if (i === 6 && app.status === 'rejected') label = 'Rejected';
    if (i === idx && app.status === 'queried') label = name + ' (query)';
    return `<li class="${cls}" ${i === idx ? 'aria-current="step"' : ''}><span>${esc(label)}</span></li>`;
  }).join('')}</ol>
  <div class="next-step ${j.who}"><span class="who">${esc(j.label)}</span><div><strong>${esc(j.title)}</strong><span class="small">${esc(j.detail)}</span></div>${nextButton(app)}</div>`;
}
function railMini(app) {
  const idx = STAGE_INDEX[app.stage]; const j = journey(app);
  return `<span class="rail-mini" aria-hidden="true">${RAIL.map((_, i) => `<i class="${i < idx ? 'done' : i === idx ? 'now ' + j.who : ''}${i === 6 && app.status === 'approved' ? ' done' : ''}"></i>`).join('')}</span>`;
}
function nextButton(app) {
  if (session().role !== 'applicant') return '';
  if (app.status === 'draft') return `<a class="btn primary" href="#edit-${slug(app.ref)}">Continue application</a>`;
  if (app.status === 'awaiting_payment') return `<button class="btn primary" data-pay="${slug(app.ref)}">Pay or upload proof</button>`;
  if (app.status === 'queried') return `<a class="btn primary" href="#app-${slug(app.ref)}" data-tab-open="queries">Answer query</a>`;
  if (app.status === 'approved') return `<button class="btn" data-cert="${slug(app.ref)}">View certificate</button>`;
  return '';
}
function myApps() { return db.apps.filter((a) => a.owner === db.me.customerNo); }
function session() { return db.session || {}; }
function addHistory(app, by, action, note = '', stage = app.stage) { app.history.push({ at: nowIso(), by, action, note, stage }); app.updated = nowIso(); }

const VIEWS = {};
let pendingTab = null;
function go(name) { if (location.hash === '#' + name) render(); else location.hash = name; }
function render() {
  const raw = (location.hash || '').slice(1) || '';
  const s = session();
  let name = raw, param = '';
  const m = raw.match(/^(app|edit|review)-(.+)$/);
  if (m) { name = m[1]; param = m[2]; }
  if (!s.role) {
    if (!['home', 'signin', 'register'].includes(name)) name = 'home';
    return renderPublic(name);
  }
  const allowed = s.role === 'applicant' ? ['dashboard', 'applications', 'new', 'edit', 'app', 'payments', 'help'] : ['intray', 'enquiries', 'review', 'help'];
  if (!allowed.includes(name)) { name = s.role === 'applicant' ? 'dashboard' : 'intray'; }
  renderShell(name, param);
}
window.addEventListener('hashchange', render);

function bindAuth() {
  const si = $('#signin');
  if (si) si.addEventListener('submit', (e) => {
    e.preventDefault();
    const c = $('#cust'), p = $('#pwd'); let ok = true;
    [c, p].forEach((el) => { const bad = !el.value.trim(); el.closest('.field').classList.toggle('invalid', bad); if (bad) ok = false; });
    if (!ok) return;
    const val = c.value.trim().toLowerCase();
    if (val === db.me.customerNo || val === db.me.email.toLowerCase()) { startSession('applicant'); }
    else { c.closest('.field').classList.add('invalid'); c.closest('.field').querySelector('.error').textContent = 'No account matches that customer number or email. In the prototype use 40112 or a demo button.'; }
  });
  $$('[data-demo]').forEach((b) => b.addEventListener('click', () => startSession(b.dataset.demo)));
  $$('[data-lost]').forEach((b) => b.addEventListener('click', (e) => { e.preventDefault(); toast('A reset link would be emailed to the address on your account.'); }));
  const rg = $('#register');
  if (rg) rg.addEventListener('submit', (e) => {
    e.preventDefault();
    const n = $('#cname'), em = $('#remail'); let ok = true;
    const nb = !n.value.trim(); n.closest('.field').classList.toggle('invalid', nb); if (nb) ok = false;
    const eb = !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em.value.trim()); em.closest('.field').classList.toggle('invalid', eb); if (eb) ok = false;

  $$('#side a').forEach((a) => a.addEventListener('click', () => $('#shell').classList.remove('nav-open')));

  $('#reset').addEventListener('click', () => modal({ title: 'Reset demo data?', body: '<p>All applications go back to the original sample data. Anything you created in this browser is removed.</p>', actions: [{ label: 'Cancel', onClick: () => true }, { label: 'Reset data', kind: 'danger', onClick: () => { const role = session().role; db = seed(); db.session = { role }; save(); render(); toast('Demo data reset.'); } }] }));
  $$('[data-soon]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); toast(a.dataset.soon + ' is not part of this prototype yet.'); }));

  bindCommon();

function bindCommon() {
  $$('[data-pay]').forEach((b) => b.addEventListener('click', () => payModal(byRef(b.dataset.pay))));
  $$('[data-cert]').forEach((b) => b.addEventListener('click', () => certModal(byRef(b.dataset.cert))));
  $$('[data-tab-open]').forEach((b) => b.addEventListener('click', (e) => {
    pendingTab = b.dataset.tabOpen;
    if (location.hash === b.getAttribute('href')) { e.preventDefault(); render(); }
  }));
  $$('tr[data-href]').forEach((tr) => {
    tr.addEventListener('click', (e) => { if (!e.target.closest('a, button')) location.hash = tr.dataset.href; });

  });
}

    </section>

      <div class="chips">${[['all', 'All'], ['action', 'Needs your action'], ['fda', 'With Rwanda FDA'], ['approved', 'Registered'], ['rejected', 'Rejected']].map(([k, l]) => `<a class="chip" href="#applications" data-filter="${k}">${l} <b>${counts[k]}</b></a>`).join('')}</div>

  $$('[data-filter]').forEach((c) => c.addEventListener('click', () => { listFilter = c.dataset.filter; }));
  $$('[data-soon-renew]').forEach((b) => b.addEventListener('click', () => toast('Renewals will reuse the registration data and follow the same journey. Not in this prototype yet.')));

function truncate(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
function groupOf(a) { if (['draft', 'awaiting_payment', 'queried'].includes(a.status)) return 'action'; if (a.status === 'in_review') return 'fda'; return a.status; }
function countByGroup(apps) { const c = { all: apps.length, action: 0, fda: 0, approved: 0, rejected: 0 }; apps.forEach((a) => { c[groupOf(a)] = (c[groupOf(a)] || 0) + 1; }); return c; }

function viewApplications() {
  const apps = myApps();
  const counts = countByGroup(apps);
  $('#main').innerHTML = `<div class="page-head"><div><h1>My applications</h1><p class="sub">Every product application you’ve started or submitted.</p></div><span class="spacer"></span><a class="btn primary" href="#new">${icon('plus')}Start an application</a></div>

      <span class="spacer"></span>
      <select id="ftype" aria-label="Product type"><option value="">All product types</option>${Object.entries(TYPES).map(([k, t]) => `<option value="${k}">${esc(t.name)}</option>`).join('')}</select>
      <input type="search" id="fq" placeholder="Search name or tracking number" aria-label="Search applications"></div>
    <div class="table-wrap"><table><thead><tr><th>Tracking number</th><th>Product</th><th>Type</th><th>Progress</th><th>Status</th><th>Last update</th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>`;
  const draw = () => {
    const t = $('#ftype').value, q = $('#fq').value.trim().toLowerCase();
    const rows = apps.filter((a) => (listFilter === 'all' || groupOf(a) === listFilter) && (!t || a.type === t) && (!q || (a.ref + ' ' + a.brand + ' ' + a.generic).toLowerCase().includes(q)))
      .sort((a, b) => b.updated.localeCompare(a.updated));
    $('#rows').innerHTML = rows.length ? rows.map((a) => `<tr class="clickable" tabindex="0" data-href="${a.status === 'draft' ? 'edit' : 'app'}-${slug(a.ref)}"><td class="ref">${a.draft ? '<span class="muted">Not yet assigned</span>' : esc(a.ref)}</td><td><strong>${esc(a.brand || 'Untitled')}</strong><div class="small muted">${esc(a.generic)}</div></td><td>${esc(TYPES[a.type].short)}</td><td>${railMini(a)}</td><td>${statusBadge(a)}</td><td class="small">${fmtDate(a.updated)}</td></tr>`).join('')

let trayFilter = { stage: '', type: '', q: '' };
function dueInfo(app) {
  const d = daysLeft(app.stageAt, SLA[app.stage]);
  if (d < 0) return { cls: 'over', text: `Overdue ${-d} day${d === -1 ? '' : 's'}`, d };
  if (d <= 3) return { cls: 'soon', text: d === 0 ? 'Due today' : `Due in ${d} day${d === 1 ? '' : 's'}`, d };
  return { cls: '', text: `Due in ${d} days`, d };
}

  const soon = active.filter((a) => { const d = dueInfo(a).d; return d >= 0 && d <= 7; }).length;
  const summary = FDA_STAGES.map((s) => ({ s, n: active.filter((a) => a.stage === s).length }));

        <select id="ttype" aria-label="Product type"><option value="">All product types</option>${Object.entries(TYPES).map(([k, t]) => `<option value="${k}" ${trayFilter.type === k ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>
        <input type="search" id="tq" placeholder="Tracking number, product or applicant" value="${esc(trayFilter.q)}" aria-label="Search"></div>
      <div class="table-wrap"><table><thead><tr><th>Deadline</th><th>Tracking number</th><th>Product</th><th>Applicant</th><th>Stage</th><th>In stage since</th></tr></thead><tbody id="trows"></tbody></table></div>

function decisionPanel(app) {
  if (app.status !== 'in_review') {
    const msg = { queried: 'Waiting for the applicant to answer a query.', awaiting_payment: 'Waiting for the applicant to pay the invoice.', approved: `Registered. Certificate ${esc(app.certNo)}.`, rejected: 'Rejected.' }[app.status] || '';
    return `<div class="panel panel-pad"><h3>No action needed</h3><p class="muted" style="margin-top:6px">${msg}</p></div>`;
  }
  const answered = (app.history[app.history.length - 1] || {}).action === 'Query answered' ? `<div class="notice gold"><strong>The applicant answered your query</strong><p class="small">Read the response in the Queries tab before deciding.</p></div>` : '';
  const comment = answered + `<div class="field"><label for="dcomment">Comment for the record</label><textarea id="dcomment" placeholder="Required when raising a query or rejecting"></textarea><span class="error">Add a comment explaining your decision.</span></div>`;
  if (app.stage === 'verification') {
    const inv = app.invoice;
    return `<div class="panel panel-pad stack"><h3>Verify payment</h3><dl class="facts" style="grid-template-columns:1fr 1fr"><div><dt>Invoice</dt><dd>${esc(inv.no)}</dd></div><div><dt>Amount</dt><dd>${money(inv.amount)}</dd></div><div><dt>Proof</dt><dd>${esc(inv.proof ? inv.proof.name : 'None')}</dd></div></dl>${comment}
      <button class="btn primary" data-d="pay-ok">Confirm payment and send to screening</button><button class="btn danger" data-d="pay-bad">Payment not received</button></div>`;
  }
  if (app.stage === 'screening') {
    const docs = docsFor(app);
    return `<div class="panel panel-pad stack"><h3>Screen for completeness</h3><p class="small muted">Tick each document you’ve checked. Missing or unacceptable items go back to the applicant as one query.</p>
      <ul style="list-style:none;margin:0;padding:0" class="stack">${docs.map((d) => `<li><label class="check"><input type="checkbox" data-chk="${d.id}" ${app.docs[d.id] ? '' : 'disabled'}><span class="small">${esc(d.name)}${app.docs[d.id] ? '' : ' <strong style="color:var(--red)">(missing)</strong>'}</span></label></li>`).join('')}</ul>
      ${aiSlot(app, 'screening')}${comment}
      <button class="btn primary" data-d="accept">Accept for assessment</button><button class="btn gold" data-d="query">Raise query to applicant</button></div>`;
  }
  if (app.stage === 'assessment') {
    return `<div class="panel panel-pad stack"><h3>Assessment</h3>${aiSlot(app, 'assessment')}
      <div class="field"><label for="dfind">Assessment findings</label><textarea id="dfind" style="min-height:120px" placeholder="Quality, safety, labelling. These become the assessment report."></textarea></div>${comment}
      <button class="btn primary" data-d="rec-approve">Recommend approval</button><button class="btn gold" data-d="query">Raise query to applicant</button><button class="btn danger" data-d="rec-reject">Recommend rejection</button></div>`;
  }
  if (app.stage === 'approval') {
    return `<div class="panel panel-pad stack"><h3>Final decision</h3><div class="notice ${app.recommendation === 'reject' ? 'red' : 'sky'}"><strong>Assessor recommends ${app.recommendation === 'reject' ? 'rejection' : 'approval'}</strong><p class="small">${esc((app.history.filter((e) => e.stage === 'assessment').pop() || {}).note || '')}</p></div>${comment}
      <button class="btn primary" data-d="approve">Approve and issue certificate</button><button class="btn" data-d="return">Return to assessment</button><button class="btn danger" data-d="reject">Reject application</button></div>`;
  }
  return '';
}
function aiSlot(app, stage) {
  const sample = stage === 'assessment' ? `<details style="margin-top:10px"><summary class="small" style="cursor:pointer;font-weight:600">Preview the output format (sample, not a real analysis)</summary>
      <ul class="small" style="margin:10px 0 0;padding-left:18px"><li><span class="badge bad">Fail</span> LBL-001 Storage conditions must include a temperature. Evidence: “Store in a cool, dry place” (label, p. 1, verified).</li><li style="margin-top:6px"><span class="badge ok">Pass</span> GEN-002 Product name, strength and dosage form stated.</li><li style="margin-top:6px"><span class="badge you">Unclear</span> MFG-001 GMP certificate validity date not found.</li></ul></details>` : '';
  return `<div class="ai-slot"><div class="row"><span class="ai-tag">${icon('spark', 'icon')} AI assist</span><span class="small muted">Integration point</span></div>
    <p class="small" style="margin-top:8px">${stage === 'screening' ? 'Planned: checks that each uploaded file is the document it claims to be and is still valid, and drafts the query for anything missing.' : 'Planned: evaluates the dossier and label against each guideline rule, with quoted evidence and page references. The assessor confirms or overrides every finding.'}</p>
    <button class="btn small" style="margin-top:10px" disabled title="Connects to POST /v1/analyses">Request AI analysis</button>${sample}</div>`;
}
function bindDecision(app) {
  const need = () => { const c = $('#dcomment'); if (!c.value.trim()) { c.closest('.field').classList.add('invalid'); c.focus(); return null; } return c.value.trim(); };
  const note = () => ($('#dcomment') ? $('#dcomment').value.trim() : '');
  const move = (stage, action, n, extra = {}) => { const from = app.stage; app.stage = stage; app.stageAt = nowIso(); Object.assign(app, extra); addHistory(app, 'fda', action, n, from); save(); };
  const finish = (msg) => { toast(msg); location.hash = 'intray'; };
  $$('[data-d]').forEach((b) => b.addEventListener('click', () => {
    const d = b.dataset.d;
    if (d === 'pay-ok') { app.invoice.status = 'verified'; move('screening', 'Payment confirmed', note()); finish(`${app.ref}: payment confirmed, moved to screening.`); }
    if (d === 'pay-bad') { const n = need(); if (!n) return; app.invoice.status = 'rejected'; app.status = 'awaiting_payment'; move('payment', 'Payment not confirmed', n); finish(`${app.ref}: returned to the applicant for payment.`); }
    if (d === 'accept') {
      const unchecked = $$('[data-chk]').filter((c) => !c.disabled && !c.checked).length;
      const missing = docsFor(app).filter((x) => x.req && !app.docs[x.id]).length;
      if (unchecked || missing) { toast(missing ? 'Required documents are missing. Raise a query instead.' : `Tick all ${$$('[data-chk]:not(:disabled)').length} documents you’ve checked before accepting.`); return; }
      move('assessment', 'Dossier accepted for assessment', note() || 'All mandatory documents present.'); finish(`${app.ref}: accepted for assessment.`);
    }
    if (d === 'query') { const n = need(); if (!n) return; app.queries.push({ id: 'q' + Date.now(), from: 'fda', at: nowIso(), stage: app.stage, text: n }); app.status = 'queried'; app.queriedAt = nowIso(); addHistory(app, 'fda', 'Query raised', truncate(n, 140)); save(); finish(`${app.ref}: query sent to ${app.applicant}.`); }
    if (d === 'rec-approve') { const f = $('#dfind').value.trim(); move('approval', 'Recommended for approval', f || note(), { recommendation: 'approve' }); finish(`${app.ref}: sent for final decision with an approval recommendation.`); }
    if (d === 'rec-reject') { const n = need(); if (!n) return; move('approval', 'Recommended for rejection', n, { recommendation: 'reject' }); finish(`${app.ref}: sent for final decision with a rejection recommendation.`); }
    if (d === 'approve') { db.seq.cert = (db.seq.cert || 100) + 1; app.status = 'approved'; app.certNo = `RW-FDA-${app.type}-${new Date().getFullYear()}-${String(db.seq.cert).padStart(4, '0')}`; app.decidedAt = nowIso(); app.expires = new Date(Date.now() + 5 * 365 * DAY).toISOString(); move('decision', 'Approved', `Certificate ${app.certNo} issued. ${note()}`.trim()); finish(`${app.ref}: approved. Certificate ${app.certNo} issued.`); }
    if (d === 'return') { const n = need(); if (!n) return; move('assessment', 'Returned to assessment', n, { recommendation: undefined }); finish(`${app.ref}: returned to assessment.`); }
    if (d === 'reject') { const n = need(); if (!n) return; app.status = 'rejected'; app.decidedAt = nowIso(); move('decision', 'Rejected', n); finish(`${app.ref}: rejected. The applicant has been notified.`); }
  }));
}
function notFound() { return `<div class="panel empty"><h2>Application not found</h2><p style="margin-top:8px">It may have been deleted, or the link is wrong.</p><p style="margin-top:14px"><a class="btn" href="#${session().role === 'applicant' ? 'applications' : 'intray'}">Back to the list</a></p></div>`; }

/* ------------------------------------------------------------------ */
load();
render();
})();
</script>
</body>
</html>
